<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog – RASAMI Beauty</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.blog-wrap{max-width:1100px;margin:0 auto;padding:2.5rem 1.25rem}
.blog-grid{display:grid;grid-template-columns:1fr;gap:1.5rem}
.blog-card{background:var(--white);border:1px solid var(--ivd);overflow:hidden;transition:transform .25s,box-shadow .25s;cursor:pointer}
.blog-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(26,58,42,.1)}
.blog-img{height:220px;overflow:hidden;position:relative}
.blog-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.blog-card:hover .blog-img img{transform:scale(1.04)}
.blog-cat-tag{position:absolute;bottom:12px;left:12px;background:var(--gd);color:var(--iv);font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;z-index:1}
.blog-body{padding:1.25rem}
.blog-meta{font-size:10px;color:var(--tmu);letter-spacing:1px;margin-bottom:.4rem;display:flex;align-items:center;gap:.5rem}
.blog-body h3{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:400;color:var(--td);margin-bottom:.5rem;line-height:1.3}
.blog-body p{font-size:12px;color:var(--tmu);line-height:1.75;margin-bottom:.75rem;font-weight:300}
.read-more{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gd);font-weight:500;background:none;border:none;border-bottom:1px solid var(--ivd);padding-bottom:2px;cursor:pointer;transition:border-color .2s;display:inline-flex;align-items:center;gap:6px}
.read-more:hover{border-color:var(--gd)}
/* ARTICLE VIEW */
#articleView{display:none;padding:2.5rem 1.25rem;max-width:760px;margin:0 auto}
#articleView.open{display:block}
.article-back{background:none;border:none;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gd);cursor:pointer;margin-bottom:1.5rem;display:flex;align-items:center;gap:6px;padding:0}
.article-hero-img{width:100%;height:280px;object-fit:cover;display:block;margin-bottom:1.5rem}
.article-cat{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem}
.article-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.7rem,5vw,2.6rem);font-weight:300;color:var(--gd);line-height:1.2;margin-bottom:.75rem}
.article-meta{font-size:11px;color:var(--tmu);margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid var(--ivd)}
.article-body p{font-size:14px;color:var(--tm);line-height:2;margin-bottom:1.5rem;font-weight:300}
.article-body h3{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:400;color:var(--gd);margin:2rem 0 .75rem}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s ease}
.reveal.visible{opacity:1;transform:translateY(0)}
@media(min-width:600px){
  .blog-grid{grid-template-columns:repeat(2,1fr)}
  .article-hero-img{height:380px}
}
@media(min-width:900px){.blog-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="page-banner">
  <p class="page-banner-tag">Skincare Journal</p>
  <h1>Beauty Wisdom,<br>African Roots</h1>
  <p>Expert tips, ingredient deep-dives, and skincare rituals curated for you.</p>
</div>

<div id="listView">
  <div class="blog-wrap">
    <div class="blog-grid" id="blogGrid"></div>
  </div>
</div>
<div id="articleView"></div>

<script src="assets/app.js"></script>
<script>
const BLOGS=[
  {
    id:1,
    image:"https://raw.githubusercontent.com/JosephElijah99/Beauty-Brand_Phone-Web/main/Images/A%20natural%20skincare%20remedy%20you%E2%80%99ll%20actually%20want%20to%20use_%20This%20green%20clay%20mask%20is%20perfect%20for%20calming%2C%20cleansing%2C%20and%20refreshing%20your%20skin_.jfif",
    cat:"Ingredient Spotlight",date:"Dec 12, 2024",
    title:"Why Rosehip Oil is the Gold Standard for African Skin",
    excerpt:"Packed with vitamins A, C & E, rosehip oil has been used for centuries to reduce hyperpigmentation and restore radiance to melanin-rich skin.",
    body:`<p>Rosehip oil — extracted from the seeds of Rosa canina — has earned its reputation as one of skincare's most potent botanical actives. For African skin in particular, its benefits go far beyond simple moisturisation.</p><h3>Rich in Vitamin A</h3><p>Unlike synthetic retinoids, rosehip oil delivers vitamin A in a gentle, natural form that works gradually to renew skin cells, fade dark spots, and improve skin texture without irritation.</p><h3>Fighting Hyperpigmentation</h3><p>Melanin-rich skin is more prone to post-inflammatory hyperpigmentation. Rosehip's vitamin C content inhibits melanin overproduction, while its linoleic acid restores barrier function to prevent future discolouration.</p><h3>How to Use It</h3><p>Apply 3–5 drops to clean, slightly damp skin before your moisturiser, morning and evening. Combine with our Turmeric Radiance Oil for a powerful brightening duo.</p>`
  },
  {
    id:2,
    image:"https://raw.githubusercontent.com/JosephElijah99/Beauty-Brand_Phone-Web/main/Images/Pinterest%20_%20Vivaciously%20Instagram%20_%20ilove_vg.jfif",
    cat:"Skincare Tips",date:"Dec 5, 2024",
    title:"SPF for Dark Skin: The Myths We Need to Bust",
    excerpt:"The dangerous myth that dark skin doesn't need sunscreen has caused real harm. Here's the science, the truth, and the right way to protect your skin.",
    body:`<p>One of the most persistent — and damaging — myths in skincare is that dark skin doesn't need sun protection. This is completely false.</p><h3>All Skin Tones Are Damaged by UV</h3><p>While melanin does provide some natural protection (roughly SPF 13), it does not eliminate the risk of UV damage. Dark skin is just as vulnerable to photoageing, uneven pigmentation, and skin cancer.</p><h3>The White Cast Problem</h3><p>Most sunscreens leave a visible white cast on darker skin. This is why we formulated our SPF 50 Glow Sunscreen specifically for melanin-rich skin — completely invisible finish, no white cast.</p><h3>Apply It Every Day</h3><p>Apply SPF 50 every morning as the final step of your skincare routine, even on cloudy days and indoors near windows.</p>`
  },
  {
    id:3,
    image:"https://raw.githubusercontent.com/JosephElijah99/Beauty-Brand_Phone-Web/main/Images/Great%20leaf.jfif",
    cat:"Skincare Routine",date:"Nov 28, 2024",
    title:"The Perfect 5-Step RASAMI Evening Routine",
    excerpt:"Night time is when your skin repairs and regenerates. Here's how to build the perfect evening routine using RASAMI products.",
    body:`<p>Your skin does most of its repair work while you sleep. The right evening routine can dramatically improve your skin's texture, tone, and overall health.</p><h3>Step 1: Cleanse</h3><p>Apply our Hydrating Gel Cleanser to dry skin first to dissolve SPF and makeup, then re-apply on wet skin. Rinse with lukewarm water.</p><h3>Step 2: Tone</h3><p>Follow with a balancing toner to restore pH balance and prepare skin to absorb actives.</p><h3>Step 3: Treat</h3><p>Apply 4–5 drops of our Niacinamide Face Serum. Press gently into skin.</p><h3>Step 4: Moisturise</h3><p>Apply Moisture Boost Face Cream over face and neck to seal in hydration overnight.</p><h3>Step 5: Body</h3><p>Finish with our Glow Essence Body Lotion or Cocoa-Mango Body Butter on the body.</p>`
  },
  {
    id:4,
    image:"https://raw.githubusercontent.com/JosephElijah99/Beauty-Brand_Phone-Web/main/Images/Natural%20Skin%20Therapy%20Facial%20Mask%20%E2%80%93%20The%20Secret%20to%20Glowing%2C%20Healthy%20%26amp%3B%20Radiant%20Skin.jfif",
    cat:"Ingredients",date:"Nov 20, 2024",
    title:"The Power of Oatmeal & Licorice for Sensitive Skin",
    excerpt:"Colloidal oatmeal and licorice root are two of nature's most powerful ingredients for soothing and brightening sensitive, melanin-rich skin.",
    body:`<p>If you have sensitive or reactive skin, colloidal oatmeal and licorice root are two ingredients you need to know about. Together, they form the heart of our Velvet Oat & Licorice Shower Milk.</p><h3>Colloidal Oatmeal</h3><p>Colloidal oatmeal has been used medicinally for centuries to relieve itching, inflammation, and irritation. Its beta-glucan content creates a protective film on the skin, locking in moisture while calming redness.</p><h3>Licorice Root (Mulethi)</h3><p>Licorice root contains glabridin, a powerful antioxidant that inhibits the enzyme responsible for melanin production after inflammation. This makes it one of the most effective natural ingredients for fading dark spots and post-acne marks.</p><h3>Perfect Together</h3><p>The combination in our Shower Milk means you cleanse, soothe, and brighten in one single step — ideal for anyone with eczema, psoriasis, or reactive skin.</p>`
  },
  {
    id:5,
    image:"https://raw.githubusercontent.com/JosephElijah99/Beauty-Brand_Phone-Web/main/Images/AMB%20Brand%203.JPG",
    cat:"African Botanicals",date:"Nov 12, 2024",
    title:"Turmeric & Honey — Africa's Original Skincare Secret",
    excerpt:"Long before modern cosmetics, African women were using turmeric and honey to achieve radiant, glowing skin. Here's the science behind the tradition.",
    body:`<p>Our Golden Glow Turmeric & Honey Soap is inspired by centuries of African beauty wisdom. Turmeric and honey are not just kitchen staples — they are two of the most scientifically validated natural skincare ingredients in existence.</p><h3>Turmeric (Curcuma longa)</h3><p>Curcumin, the active compound in turmeric, is a potent anti-inflammatory and antioxidant. It inhibits the production of excess melanin, making it highly effective for fading dark spots and hyperpigmentation — a common concern for African skin.</p><h3>Raw Honey</h3><p>Raw honey is a natural humectant, meaning it draws moisture from the air into the skin. It also contains hydrogen peroxide in small amounts, giving it natural antibacterial properties that help fight acne-causing bacteria.</p><h3>Handcrafted with Purpose</h3><p>Our artisan soap bar is cold-processed to preserve the full potency of both ingredients, combined with shea butter and vitamin E for a formula that cleanses, brightens, and deeply nourishes in one step.</p>`
  },
  {
    id:6,
    image:"https://raw.githubusercontent.com/JosephElijah99/Beauty-Brand_Phone-Web/main/Images/AMB%20Brand%205.JPG",
    cat:"How-To",date:"Nov 4, 2024",
    title:"How to Build a Complete RASAMI Body Care Routine",
    excerpt:"Great skin doesn't stop at the face. Here's how to build a complete head-to-toe body care routine using RASAMI Beauty products.",
    body:`<p>Most people focus their skincare on the face, but the body deserves just as much attention. Here's how to build a complete body care ritual with RASAMI Beauty.</p><h3>Step 1: Exfoliate (2–3x per week)</h3><p>Start with our Island Coconut Body Polish on dry or damp skin. Apply in circular motions, paying extra attention to rough areas like knees, elbows, and heels. The sugar crystals gently buff away dead skin cells while coconut oil nourishes simultaneously.</p><h3>Step 2: Cleanse</h3><p>Follow with our Velvet Oat & Licorice Shower Milk. Apply to a wet puff or washcloth and lather over the entire body. The licorice root will help fade any dark spots on the body over time.</p><h3>Step 3: Moisturise (Daily)</h3><p>Immediately after patting skin dry, apply your moisturiser while skin is still slightly damp — this seals in hydration most effectively. Choose the Glow Essence Body Lotion for daytime and the Cocoa-Mango Body Butter for nights when you want deeper nourishment.</p>`
  },
];

renderNav(); renderFooter(); injectCartAndModal(); updateCartUI();

document.getElementById('blogGrid').innerHTML=BLOGS.map(b=>`
  <div class="blog-card reveal" onclick="openArticle(${b.id})">
    <div class="blog-img">
      <img src="${b.image}" alt="${b.title}" loading="lazy" onerror="this.parentElement.style.background='var(--ivw)';this.remove()">
      <div class="blog-cat-tag">${b.cat}</div>
    </div>
    <div class="blog-body">
      <div class="blog-meta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:12px;height:12px"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        ${b.date}
      </div>
      <h3>${b.title}</h3>
      <p>${b.excerpt}</p>
      <button class="read-more">
        Read Article
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>`).join('');

function openArticle(id){
  const b=BLOGS.find(x=>x.id===id); if(!b) return;
  document.getElementById('listView').style.display='none';
  const av=document.getElementById('articleView');
  av.classList.add('open');
  av.innerHTML=`
    <button class="article-back" onclick="closeArticle()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Journal
    </button>
    <img class="article-hero-img" src="${b.image}" alt="${b.title}" onerror="this.remove()">
    <div class="article-cat">${b.cat}</div>
    <h1 class="article-title">${b.title}</h1>
    <div class="article-meta">${b.date} · RASAMI Beauty Editorial</div>
    <div class="article-body">${b.body}</div>`;
  window.scrollTo(0,0);
}
function closeArticle(){
  document.getElementById('listView').style.display='block';
  const av=document.getElementById('articleView');
  av.classList.remove('open'); av.innerHTML='';
}

const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('visible');}),{threshold:.08});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>
